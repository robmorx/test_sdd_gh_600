[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devlog"
version = "0.1.0"
description = "Consola de notas de desarrollo almacenadas en SQLite, con exportacion a Markdown."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer==0.27.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
]

[project.scripts]
devlog = "devlog.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
